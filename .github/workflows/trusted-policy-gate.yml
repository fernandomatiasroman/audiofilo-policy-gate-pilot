name: Trusted Policy Gate Pilot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected workflows and synthetic input
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["GH_REPO"]
          head_repo = os.environ["HEAD_REPO"]
          sha = os.environ["HEAD_SHA"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          if repo != "fernandomatiasroman/audiofilo-policy-gate-pilot":
              raise SystemExit("STOP_UNEXPECTED_REPOSITORY")

          if head_repo != repo:
              raise SystemExit("STOP_UNSUPPORTED_FORK")

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("STOP_INVALID_SHA")

          if not re.fullmatch(r"[1-9][0-9]*", pr):
              raise SystemExit("STOP_INVALID_PR")

          files = fetch(
              f"https://api.github.com/repos/{repo}/"
              f"pulls/{pr}/files?per_page=100&page=1"
          )

          if not isinstance(files, list) or len(files) >= 100:
              raise SystemExit("STOP_INCOMPLETE_FILE_LIST")

          if not files:
              raise SystemExit("STOP_EMPTY_FILE_LIST")

          protected = {
              ".github/workflows/policy-gate.yml",
              ".github/workflows/real-tests.yml",
              ".github/workflows/trusted-policy-gate.yml",
          }

          for entry in files:
              if not isinstance(entry, dict):
                  raise SystemExit("STOP_INVALID_FILE_ENTRY")

              filename = entry.get("filename")
              previous = entry.get("previous_filename")

              if not isinstance(filename, str):
                  raise SystemExit("STOP_INVALID_FILENAME")

              if filename in protected or previous in protected:
                  raise SystemExit(
                      f"STOP_PROTECTED_WORKFLOW_CHANGED:{filename}"
                  )

          print("PROTECTED_WORKFLOWS=PASS")

          document = fetch(
              f"https://api.github.com/repos/{repo}/"
              f"contents/gate-input.json?ref={sha}"
          )

          if document.get("encoding") != "base64":
              raise SystemExit("STOP_INVALID_ENCODING")

          encoded = document["content"]

          if not isinstance(encoded, str):
              raise SystemExit("STOP_INVALID_BASE64_CONTENT")

          normalized = encoded.replace("\n", "").replace("\r", "")

          try:
              raw = base64.b64decode(
                  normalized, validate=True
              )
          except (binascii.Error, ValueError):
              raise SystemExit("STOP_INVALID_BASE64_CONTENT")

          if len(raw) > 8192:
              raise SystemExit("STOP_INPUT_TOO_LARGE")

          data = json.loads(raw)

          if type(data) is not dict or data != {"ready": True}:
              raise SystemExit("TRUSTED_POLICY_GATE=FAIL")

          print(f"VALIDATED_HEAD_SHA={sha}")
          print("TRUSTED_POLICY_GATE=PASS")
          PY
