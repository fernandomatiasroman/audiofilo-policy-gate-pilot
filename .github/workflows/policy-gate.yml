name: Policy Gate Pilot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate synthetic evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("gate-input.json").read_text(encoding="utf-8")
          )

          if type(data) is not dict or data != {"ready": True}:
              raise SystemExit("POLICY_GATE=FAIL")

          print("POLICY_GATE=PASS")
          PY
